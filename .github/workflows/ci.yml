name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    # The lowest Flutter the pubspec allows. The formatter check lives here
    # because the repository is formatted with the Dart of Flutter 3.44; the
    # Dart of 3.47 formats four test files differently. Both the check and
    # this version move when the package moves to a newer Flutter.
    name: Dart on the lowest supported Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - name: Check the formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze the package and the example
        run: flutter analyze
      - name: Test the package
        run: flutter test
      - name: Test the example
        run: flutter test
        working-directory: example

  dart-stable:
    # The current stable, which most users are on. No flutter-version is
    # given: the action resolves the newest release of the channel, and a
    # version of "stable" is not a version it can resolve.
    name: Dart on the current stable Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze the package and the example
        run: flutter analyze
      - name: Test the package
        run: flutter test
      - name: Test the example
        run: flutter test
        working-directory: example

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      # gradlew, the wrapper jar and local.properties are not checked in.
      # Flutter writes all three when it generates the build files.
      - name: Generate the Android build files
        run: flutter build apk --debug --config-only
        working-directory: example
      - name: Test the plugin
        run: ./gradlew --no-daemon :one_tap_location:testDebugUnitTest
        working-directory: example/android

  ios:
    name: iOS unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Build for the simulator
        run: flutter build ios --simulator --no-codesign
        working-directory: example
      # The runner's simulator names change with Xcode, so one is looked up.
      - name: Test the plugin
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if x["name"].startswith("iPhone")))')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination "id=$udid"
        working-directory: example/ios
